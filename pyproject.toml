[project]
name = "beverage-demand"
version = "0.1.0"
description = "Beverage demand forecasting, price elasticity and promotion analytics on Dominick's soft-drink scanner data"
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
    "pandas>=2.2,<3",
    "numpy>=1.26",
    "pyarrow>=15",
    "pyyaml>=6",
    "statsmodels>=0.14",
    "lightgbm>=4.3",
    "shap>=0.45",
    "scipy>=1.12",
    "matplotlib>=3.8",
    "requests>=2.31",
    "tabulate>=0.10.0",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.5",
    "jupyter>=1.0",
    "nbconvert>=7",
    "ipykernel>=6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/beverage_demand"]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["notebooks"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "NPY"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
